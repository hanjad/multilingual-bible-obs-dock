<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bible Display</title>
  <link rel="stylesheet" href="css/display.css" />
</head>
<body>
  <div id="verse-container" hidden>
    <div class="verse-block main">
      <p class="verse-text" id="main-text"></p>
      <p class="verse-label" id="main-label"></p>
    </div>
    <div class="verse-block sub">
      <p class="verse-text" id="sub-text"></p>
      <p class="verse-label" id="sub-label"></p>
    </div>
    <p class="verse-ref" id="verse-ref"></p>
  </div>

  <script type="module" src="src/display.js"></script>
</body>
</html>
